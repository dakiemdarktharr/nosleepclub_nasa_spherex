name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and repository evidence
    # MongoDB 8.0 refuses affected kernels >=6.19 (SERVER-121912).
    # The Ubuntu 22.04 image currently uses the compatible 6.8 Azure kernel.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - id: install
        name: Install pinned science and web dependencies
        run: python -m pip install -r requirements.txt -r web/requirements.txt -r requirements-ops.txt
      - name: Compile Python source
        run: python -m compileall -q scripts tests web/api
      - name: Check source whitespace
        run: |
          python - <<'PY'
          from pathlib import Path
          files = list(Path('scripts').glob('*.py')) + list(Path('tests').glob('*.py'))
          files += list(Path('web/api').glob('*.py')) + list(Path('web').glob('*.js'))
          bad = [f'{p}:{i}' for p in files for i, line in enumerate(p.read_text(encoding='utf-8-sig').splitlines(), 1)
                 if line.rstrip(' \t') != line]
          if bad:
              raise SystemExit('\n'.join(bad))
          print(f'No trailing whitespace in {len(files)} source files')
          PY
      - name: Start disposable MongoDB replica set
        id: mongo
        run: |
          uname -sr
          docker run --detach --name codex-review-test --publish 127.0.0.1:27027:27017 mongo:8.0@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142 --replSet codex-review-test --bind_ip_all
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Running}}' codex-review-test)" != "true" ]; then docker logs codex-review-test; exit 1; fi
            if docker exec codex-review-test mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec codex-review-test mongosh --quiet --eval 'rs.initiate({_id:"codex-review-test",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          python - <<'PY'
          import time
          from pymongo import MongoClient
          client=MongoClient('mongodb://127.0.0.1:27027/?directConnection=true',serverSelectionTimeoutMS=1000)
          for attempt in range(60):
              try:
                  hello=client.admin.command('hello')
                  if hello.get('isWritablePrimary') and hello.get('setName')=='codex-review-test':
                      print('Disposable loopback replica set ready')
                      client.close()
                      break
              except Exception:
                  pass
              time.sleep(.5)
          else:
              raise SystemExit('Replica set did not become primary')
          PY
      - name: Run all Python unit tests
        env:
          REVIEW_TEST_MONGODB_URI: mongodb://127.0.0.1:27027/?directConnection=true
        run: |
          set -o pipefail
          mkdir -p data/raw/benchmark
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
      - name: Create evidence report
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: python scripts/check_readiness.py > "$RUNNER_TEMP/readiness.json"
      - name: Upload evidence and test output
        if: ${{ always() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-readiness-${{ github.sha }}
          path: |
            ${{ runner.temp }}/readiness.json
            ${{ runner.temp }}/unittest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove disposable MongoDB container
        if: ${{ always() }}
        run: |
          docker logs --tail 100 codex-review-test || true
          docker rm --force --volumes codex-review-test || true

  javascript:
    name: JavaScript syntax and review store
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check browser JavaScript syntax
        run: for source in web/*.js; do node --check "$source"; done
      - name: Test ReviewStore pure cases
        run: node tests/review-store.test.cjs
      - name: Test explorer request and display races
        run: node tests/explorer.test.cjs
      - name: Test linked evidence refusals and report loading
        run: node tests/linked-evidence.test.cjs
      - name: Test neighbor factorial and all control denominators
        run: node tests/neighbor-evidence.test.cjs
      - name: Test reference stars and sealed presence evidence
        run: node tests/reference-evidence.test.cjs
      - name: Test staged shape and shared covariance evidence
        run: node tests/calibration-evidence.test.cjs
      - name: Test fixed-weight profile diagnostic evidence
        run: node tests/profile-evidence.test.cjs
